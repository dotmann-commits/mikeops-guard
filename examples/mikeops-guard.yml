# Copy to .github/workflows/mikeops-guard.yml in the repository you want to protect.
# Pinned to the v0.2.0 release commit. Check the releases page for newer versions.
name: MikeOps Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history, so Gitleaks can find secrets in old commits
          persist-credentials: false

      - uses: dotmann-commits/mikeops-guard@8847a1a16fc9b09f664f56f55a268d02f39e679b # v0.2.0
        with:
          fail-on: high
      - if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: mikeops-guard-report/report.sarif

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mikeops-guard-report
          path: mikeops-guard-report/
